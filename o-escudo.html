<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Escudo</title>
<style>
:root{
  --azul:#1e5f8c;
  --dourado:#4a90c2;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Segoe UI', Arial, sans-serif;
  background:linear-gradient(180deg,#f4f8fb 0%,#e8f2fa 100%);
  color:#1a2b3c;
  padding-bottom:40px;
}
header{
  background:var(--azul);
  color:#fff;
  padding:22px 16px 18px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
  position:sticky;
  top:0;
  z-index:10;
}
header a{
  color:#dcebf7;
  text-decoration:none;
  font-size:14px;
}
h1{
  margin:8px 0 0;
  font-size:clamp(24px,6vw,34px);
  letter-spacing:.5px;
}
.subtitulo{
  font-size:13px;
  color:#dcebf7;
  margin-top:4px;
}
main{
  max-width:700px;
  margin:0 auto;
  padding:20px 18px;
}
.estrofe{
  background:#fff;
  border-left:5px solid var(--azul);
  border-radius:10px;
  padding:18px 20px;
  margin-bottom:18px;
  box-shadow:0 2px 6px rgba(0,0,0,.06);
}
.refrao{
  border-left:5px solid var(--dourado);
  background:#f2f8fc;
}
.refrao::before{
  content:"REFRÃO";
  display:block;
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  color:var(--dourado);
  margin-bottom:8px;
}
p.linha{
  margin:0 0 6px;
  font-size:clamp(19px,4.6vw,24px);
  line-height:1.5;
}
p.linha:last-child{margin-bottom:0;}
.controles{
  display:flex;
  justify-content:center;
  gap:12px;
  margin:20px 0 6px;
}
button{
  background:var(--azul);
  color:#fff;
  border:none;
  padding:10px 18px;
  border-radius:20px;
  font-size:15px;
  cursor:pointer;
}
button:active{opacity:.8;}
.rodape{
  text-align:center;
  font-size:12px;
  color:#7a8fa3;
  margin-top:30px;
}
</style>
</head>
<body>
<header>
<a href="index.html">← Louvores</a>
<h1>O Escudo</h1>
<div class="subtitulo">IJEFONT</div>
</header>
<main id="letra">

<div id="estrofes"></div>

<div id="editor" style="display:none;margin-bottom:18px;">
<textarea id="texto" rows="14" placeholder="Cole aqui a letra. Deixe uma linha em branco entre as estrofes." style="width:100%;font-size:18px;padding:12px;border-radius:10px;border:1px solid #ccc;"></textarea>
<div class="controles">
<button onclick="salvarLetra()">Salvar</button>
<button onclick="fecharEditor()">Cancelar</button>
</div>
</div>

<div class="controles">
<button onclick="abrirEditor()">✏️ Colar / editar letra</button>
<button onclick="alternarFoto()">📷 Ver foto da folha</button>
</div>

<div id="foto" style="display:none;margin-bottom:18px;">
<img src="o-escudo.jpg" alt="Folha do louvor O Escudo" style="width:100%;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.2);">
</div>

<div class="controles">
<button onclick="mudarFonte(2)">A+</button>
<button onclick="mudarFonte(-2)">A-</button>
</div>

<div class="rodape">© Irmão Claudio</div>
</main>
<script>
const CHAVE='letra-o-escudo';
function mudarFonte(delta){
  const linhas = document.querySelectorAll('.linha');
  linhas.forEach(l=>{
    const atual = parseFloat(getComputedStyle(l).fontSize);
    l.style.fontSize = (atual + delta) + 'px';
  });
}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mostrar(){
  let t='';
  try{t=localStorage.getItem(CHAVE)||'';}catch(e){}
  const box=document.getElementById('estrofes');
  if(!t.trim()){
    box.innerHTML='<div class="estrofe"><p class="linha">Toque em "Colar / editar letra" para adicionar a letra.</p></div>';
    return;
  }
  box.innerHTML=t.trim().split(/\n\s*\n/).map(b=>'<div class="estrofe">'+b.split('\n').filter(x=>x.trim()).map(x=>'<p class="linha">'+esc(x.trim())+'</p>').join('')+'</div>').join('');
}
function abrirEditor(){
  let t='';try{t=localStorage.getItem(CHAVE)||'';}catch(e){}
  document.getElementById('texto').value=t;
  document.getElementById('editor').style.display='block';
}
function alternarFoto(){const f=document.getElementById('foto');f.style.display=f.style.display==='none'?'block':'none';}
function fecharEditor(){document.getElementById('editor').style.display='none';}
function salvarLetra(){
  try{localStorage.setItem(CHAVE,document.getElementById('texto').value);}catch(e){}
  fecharEditor();mostrar();
}
mostrar();
</script>
</body>
</html>
